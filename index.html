<style>
:root{--bg:#fff7ef;--c:#fff;--t:#222;--m:#666;--p:#e8750c;--b:#ffd166;--no:#d62828;--l:#f7dcc3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#25170b;--c:#33200f;--t:#fff1e3;--m:#d9bd9f;--l:#5d3d1f}}
:root[data-theme=dark]{--bg:#25170b;--c:#33200f;--t:#fff1e3;--m:#d9bd9f;--l:#5d3d1f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px;text-align:center}h1{margin:0;font-size:21px}header p{margin:2px 0 0;color:var(--m);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--l)}
nav button{flex:none;min-width:40px;border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:20px;padding:5px 11px;font:inherit;font-size:14px}
nav button.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:800px;margin:0 auto;padding:10px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:0 0 6px;font-size:19px;color:var(--p)}ul{margin:4px 0;padding-left:20px}
.q{border-top:1px dashed var(--l);padding:10px 0}.q label{display:block;padding:6px 10px;margin:4px 0;border:2px solid var(--l);border-radius:10px}
.fb{font-size:14px;color:var(--m)}.fb.ok{color:var(--p)}.fb.no{color:var(--no)}
.sub{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 26px;font:inherit;font-weight:700;margin-top:8px}.sub:disabled{opacity:.5}
.sc{font-size:20px;font-weight:700;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}

const TRN=["说到这里，我想起了……","事情还要从那天说起。","就在这时，意想不到的事发生了。","回想起来，那一刻……","正是因为这件事，我才明白……","不知过了多久，……","转眼间，……","然而，事情并没有那么简单。"];
const TP=[["《我最难忘的一件事》","选一件有细节、有感情的小事，重点写经过和内心变化"],["《我的老师》《我的妈妈》","不要罗列优点，用一两件小事表现特点"],["《一次成功的尝试》","把失败的过程写足，才能突出成功的价值"],["《假如我是……》","先交代设想，再写具体做法和意义，想象要合理"],["《我的烦恼》","写清烦恼是什么、怎样解决、有什么启发"],["《读后感》","先简述内容，再写感受，联系生活，最后升华"]];
const UG=[["然后","接着、随后、紧接着、不久之后"],["很高兴","欣喜若狂、喜出望外、心花怒放"],["很伤心","悲痛欲绝、黯然神伤、泪如雨下"],["看","凝视、眺望、打量、注视、瞥见"],["说","叮嘱、感叹、喃喃自语、脱口而出、高声宣布"],["走","踱步、漫步、蹒跚、疾步、徘徊"],["跑","飞奔、疾驰、一溜烟、狂奔"],["哭","哽咽、抽泣、泪流满面、放声大哭"],["笑","微笑、嫣然一笑、哈哈大笑、忍俊不禁、笑逐颜开"],["很多","数不胜数、不计其数、成千上万、比比皆是"],["很美","美不胜收、如诗如画、令人陶醉"],["很大","庞大、巨大、浩瀚、宏伟"],["突然","霎时、顿时、骤然、猛地"],["因为…所以…","正因为…才…、由于…因而…"]];
let LT=0,LQ="";
function lib(t,q){if(t!==undefined)LT=t;if(q!==undefined)LQ=q;const T=["好词好句","名言警句","开头结尾","描写方法","结构思路","升级表"],ok=s=>!LQ||s.includes(LQ),li=(a,f)=>a.filter(x=>ok(JSON.stringify(x))).map(f).join(""),C=(h,b)=>b?`<div class="card"><h2>${h}</h2>${b}</div>`:"";let b="";
if(LT==0)b=Object.entries(LB).filter(([k,v])=>ok(k+v[0].join("")+v[1].join(""))).map(([k,v])=>C(k,`<p><b>好词：</b>${v[0].join("　")}</p><ul>${v[1].map(x=>`<li>${x}</li>`).join("")}</ul>`)).join("");
else if(LT==1)b=C("名言警句",`<ul>${li(QT,x=>`<li>${x[0]}<br><span class="fb">—— ${x[1]} ｜ 适用：${x[2]}</span></li>`)}</ul>`);
else if(LT==2)b=C("开头金句",`<ul>${li(OPN,x=>`<li><b>【${x[0]}】</b>${x[1]}</li>`)}</ul>`)+C("结尾升华",`<ul>${li(ENDN,x=>`<li><b>【${x[0]}】</b>${x[1]}</li>`)}</ul>`);
else if(LT==3)b=C("描写方法",`<ul>${li(MT,x=>`<li><b>${x[0]}</b>：${x[1]}<br>例：${x[2]}</li>`)}</ul>`);
else if(LT==4)b=C("文章结构",`<ul>${li(STR,x=>`<li><b>${x[0]}</b>：${x[1]}</li>`)}</ul>`)+C("过渡句",`<ul>${TRN.filter(ok).map(x=>`<li>${x}</li>`).join("")}</ul>`)+C("题目思路",`<ul>${li(TP,x=>`<li><b>${x[0]}</b>：${x[1]}</li>`)}</ul>`);
else b=C("词语升级表",`<ul>${li(UG,x=>`<li><b>${x[0]}</b> → ${x[1]}</li>`)}</ul>`);
$("#main").innerHTML=`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:6px">${T.map((n,i)=>`<button class="sub" style="padding:6px 12px;margin:0;${i==LT?"":"opacity:.5"}" onclick="lib(${i})">${n}</button>`).join("")}</div><input class="ty" id="lq" placeholder="搜索关键词，例如：勇气、雨、感谢" value="${LQ.replace(/"/g,"&quot;")}"></div>`+(b||`<div class="card">没有找到相关内容</div>`);
$("#lq").oninput=e=>{const v=e.target.value;lib(LT,v);const i=$("#lq");i.focus();i.setSelectionRange(v.length,v.length)}}
go(0);

</script></body></html>
